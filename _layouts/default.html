<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#05070D" />
    <script>
      /* The look (Original / Moonlit / Stoned Witches 18+) and the AI-art switch, set before first paint (site 0.13). */
      (function () { try { var l = localStorage.getItem('botb.look') || 'original', a = localStorage.getItem('botb.adult') === '1';
        if (l === 'swh' && !a) l = 'original'; document.documentElement.dataset.look = l;
        document.documentElement.dataset.aiart = localStorage.getItem('botb.aiart') === 'off' ? 'off' : 'on'; } catch (e) {} })();
    </script>
    <!-- Dev site: kept out of search engines until the hosts adopt it as their main site (Chuck, 2026-10-07). -->
    <meta name="robots" content="noindex, nofollow, noarchive" />
    {% seo %}
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap"
    />
    <link rel="stylesheet" href="{{ '/assets/css/grimoire.css' | relative_url }}" />
    <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/img/favicon-32.png' | relative_url }}" />
    <link rel="icon" type="image/png" sizes="512x512" href="{{ '/assets/img/icon-512.png' | relative_url }}" />
    <link rel="apple-touch-icon" href="{{ '/assets/img/apple-touch-icon.png' | relative_url }}" />
    <link rel="alternate" type="application/rss+xml" title="Back on the Broomstick (podcast feed)" href="{{ site.data.links.feed | escape }}" />
    <link rel="alternate" type="application/atom+xml" title="The Grimoire (blog)" href="{{ '/blog/feed.xml' | relative_url }}" />
  </head>
  <body class="{{ page.body_class }}">
    <a class="skip" href="#main">Skip to content</a>
    {% include header.html %}
    {% include announcement.html %}
    <main id="main">{{ content }}</main>
    {% include footer.html %}
    {% include tabbar.html %}
    <script>
      window.BOTB = { base: '{{ site.baseurl }}', api: {{ site.data.links.archive_api | jsonify }} };
    </script>
    <script src="{{ '/assets/js/sky.js' | relative_url }}" defer></script>
    <script src="{{ '/assets/js/botb.js' | relative_url }}" defer></script>
  </body>
</html>
