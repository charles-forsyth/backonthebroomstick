title: Back on the Broomstick
description: "A modern witch's spoken word grimoire. Laylla and Chelle talk modern witchcraft, pagan practice, tarot and the occasional haunted brothel."
tagline: "A podcast for today's witches, pagans, heathens and magical souls"
url: https://charles-forsyth.github.io
baseurl: /backonthebroomstick
lang: en_US
timezone: America/New_York

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

plugins:
  - jekyll-seo-tag
  - jekyll-feed
# No jekyll-sitemap: the dev site stays out of search engines (see the robots meta tag in _layouts/default.html).

defaults:
  - scope:
      path: ""
    values:
      layout: page
  # The witches' blog (The Grimoire): one Markdown file per post in _posts/, written through the archive service.
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      permalink: /blog/:title/
      body_class: post-page

feed:
  path: blog/feed.xml
  posts_limit: 30

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - docs
  - tools
